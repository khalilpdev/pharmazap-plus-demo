# =============================================================================
# Evolution Go — WhatsApp Não-Oficial (Go + whatsmeow)
# =============================================================================
#
# Arquivo separado para isolar o Evolution Go do stack principal do PharmazapPlus.
#
# COMO USAR:
#   1. Copie este arquivo para o servidor onde o Evolution Go ficará hospedado.
#   2. Crie um arquivo .env no mesmo diretório com as variáveis necessárias.
#   3. Execute: docker compose -f docker-compose-evolution-go.yml up -d
#
# MULTI-TENANT:
#   Uma única instância deste Evolution Go pode atender VÁRIAS farmácias cadastradas
#   no PharmazapPlus. Cada farmácia recebe um nome de instância único (ChaveWhatsApp)
#   gerado automaticamente pelo sistema. Todos compartilham a mesma URL e API Key.
#
# Consulte docs/WHATSAPP_EVOLUTION-GO.md para o guia completo de configuração.
# =============================================================================

services:
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6000:6000"
    env_file:
      - .env
    depends_on:
      postgres-evogo:
        condition: service_healthy
    volumes:
      - evolution_go_data:/app/data
    networks:
      - evolution-go-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres-evogo:
    image: postgres:16-alpine
    container_name: postgres-evogo
    restart: unless-stopped
    environment:
      POSTGRES_USER: evogo
      POSTGRES_PASSWORD: ${EVOGO_POSTGRES_PASSWORD:?defina EVOGO_POSTGRES_PASSWORD no .env}
      POSTGRES_MULTIPLE_DATABASES: evogo_auth,evogo_users
    volumes:
      - postgres_evogo_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - evolution-go-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evogo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_go_data:
  postgres_evogo_data:

networks:
  evolution-go-net:
    driver: bridge
